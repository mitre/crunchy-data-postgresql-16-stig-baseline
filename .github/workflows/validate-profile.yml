name: Validate Profile against PostgreSQL 16

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate (vanilla)
    runs-on: ubuntu-latest
    env:
      LC_ALL: "en_US.UTF-8"
      PLATFORM: "postgres16"
      SUITE: "vanilla"
    steps:
      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Disable ri and rdoc
        run: 'echo "gem: --no-ri --no-rdoc" >> ~/.gemrc'

      - name: Run Bundle Install
        run: bundle install

      - name: Print CINC Auditor version
        run: bundle exec cinc-auditor version

      - name: Vendor the Profile
        run: bundle exec cinc-auditor vendor . --overwrite

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16

      - name: Setup and start PostgreSQL 16
        run: |
          # Ensure the cluster exists and is running (peer auth by default)
          sudo pg_ctlcluster 16 main start || true
          sudo systemctl start postgresql

          # Set password and create test database (peer auth works for sudo -u postgres)
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'testpassword';"
          sudo -u postgres psql -c "CREATE DATABASE testdb;"

          # Configure pg_hba.conf: peer for postgres user, scram-sha-256 for TCP
          printf '%s\n' \
            'local   all   postgres                peer' \
            'local   all   all                     scram-sha-256' \
            'host    all   all       127.0.0.1/32  scram-sha-256' \
            'host    all   all       ::1/128       scram-sha-256' \
            | sudo tee /etc/postgresql/16/main/pg_hba.conf > /dev/null

          # Ensure PostgreSQL listens on localhost
          sudo sed -i "s/^#\?listen_addresses.*/listen_addresses = 'localhost'/" /etc/postgresql/16/main/postgresql.conf
          sudo sed -i "s/^#\?password_encryption.*/password_encryption = 'scram-sha-256'/" /etc/postgresql/16/main/postgresql.conf

          # Restart to apply config changes
          sudo systemctl restart postgresql

          # Verify connectivity
          pg_isready -h 127.0.0.1 -p 5432
          PGPASSWORD=testpassword psql -h 127.0.0.1 -U postgres -d testdb -c "SELECT version();"

      - name: Create results directory
        run: mkdir -p spec/results

      - name: Run the InSpec profile
        continue-on-error: true
        run: |
          sudo env "PATH=$PATH" bundle exec cinc-auditor exec . \
            --input-file ./inputs_postgres16_ci.yml \
            --reporter cli json:spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}.json \
            --enhanced-outcomes

      - name: Save results summary
        continue-on-error: true
        uses: mitre/saf_action@v1.5.2
        with:
          command_string: "view summary -j -i spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}.json -o spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}-data.json"

      - name: Save Test Result JSON
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLATFORM }}_${{ env.SUITE }}
          path: spec/results/

      - name: Display results summary
        uses: mitre/saf_action@v1.5.2
        with:
          command_string: "view summary -i spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}.json"

      - name: Generate Markdown Summary
        continue-on-error: true
        run: |
          cat spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}-data.json | python3 markdown-summary.py > spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}-markdown-summary.md
          cat spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}-markdown-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Ensure the scan meets our vanilla threshold
        uses: mitre/saf_action@v1.5.2
        with:
          command_string: "validate threshold -i spec/results/${{ env.PLATFORM }}_${{ env.SUITE }}.json -F vanilla.threshold.yml"
